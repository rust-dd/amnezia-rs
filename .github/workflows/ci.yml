name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Install test runner
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.114
      - name: Workspace tests
        run: cargo nextest run --workspace --locked --show-progress counter --status-level pass --no-fail-fast
      - name: Documentation tests
        run: cargo test --workspace --doc --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Release compilation
        run: cargo build -p amnezia --release --locked
      - name: Python tools
        run: python3 -m py_compile scripts/playtest.py scripts/verify-playtest-evidence.py
