[workspace]
resolver = "3"
members = [
    "amnezia",
    "amnezia-convert",
    "amnezia-data",
    "lcf",
    "xyz",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.1.0"

[workspace.dependencies]
amnezia-data = { path = "amnezia-data" }
anyhow = "1.0.103"
bevy = "0.19.0"
bevy_ecs_tilemap = "0.19.0"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
image = "0.25.10"
lcf = { path = "lcf" }
ron = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
xyz = { path = "xyz" }
